name: "Build"

on:
  push:
    branches:
      - main
  pull_request:
    branches: [ main ]

env:
  ACTIONS_STEP_DEBUG: true

jobs:
  build_all:
    strategy:
      fail-fast: false
      matrix:
        targets: [
          { os: "macos-15", rust_targets: "aarch64-apple-darwin", package_manager: "brew" },
          { os: "macos-15-intel", rust_targets: "x86_64-apple-darwin", package_manager: "brew" }, # mac with intel cpu
          { os: "ubuntu-22.04", rust_targets: "x86_64-unknown-linux-gnu", package_manager: "apt" },
          { os: "ubuntu-22.04-arm", rust_targets: "aarch64-unknown-linux-gnu", package_manager: "apt" },
          { os: "windows-2025", rust_targets: "x86_64-pc-windows-msvc", package_manager: "winget" },
          { os: "windows-11-arm", rust_targets: "aarch64-pc-windows-msvc", package_manager: "winget" },
        ]
    runs-on: ${{ matrix.targets.os }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install Dependencies
        if: "${{ matrix.targets.package_manager == 'apt' }}"
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends libwayland-dev libxkbcommon-dev libgtk-4-dev xvfb python3-gi xclip i3 dunst x11-xkb-utils x11-utils dbus-daemon ibus ibus-gtk4 phinger-cursor-theme adwaita-icon-theme-full xsettingsd picom sway grim wl-clipboard xdg-desktop-portal-gtk xdg-desktop-portal-gnome mako-notifier

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.targets.rust_targets }}
          components: rustfmt, clippy
          rust-src-dir: "native"
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
#      - name: Lint with Gradle
#        run: ./gradlew lint
      - name: Test with Gradle
        run: ./gradlew test testGtk testWayland --info
      - name: Build with Gradle
        run: ./gradlew build

      - name: Publish Test Report
        if: always() # Ensure this step runs even if the test step fails
        uses: dorny/test-reporter@v3
        with:
          name: Tests Report (${{ matrix.os }})
          path: kotlin-desktop-toolkit/build/test-results/test/*.xml,kotlin-desktop-toolkit/build/test-results/testGtk/*.xml,kotlin-desktop-toolkit/build/test-results/testWayland/*.xml
          reporter: java-junit
          fail-on-empty: false
          fail-on-error: false
